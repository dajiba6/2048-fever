<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048 狂热 · 特效预览</title>
<style>
  :root { --ink: #776e65; --board: #bbada0; --gap: 8px; --pad: 8px; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 28px 20px 48px;
    background: #faf8ef;
    color: var(--ink);
    font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  header.top { max-width: 1080px; margin: 0 auto 18px; }
  h1 { margin: 0; font-size: 32px; letter-spacing: -0.5px; }
  h1 em {
    font-style: normal;
    font-size: 14px;
    color: #fffaf5;
    background: #f65e3b;
    border-radius: 999px;
    padding: 3px 8px;
    vertical-align: 6px;
  }
  .top p { margin: 8px 0 0; max-width: 40em; line-height: 1.5; }
  .gallery {
    max-width: 1080px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }
  .card {
    background: #fffaf3;
    border-radius: 14px;
    padding: 14px 14px 16px;
    box-shadow: 0 8px 24px rgba(80, 60, 40, .06);
  }
  .card.good { box-shadow: inset 0 0 0 2px rgba(240, 170, 40, .45), 0 8px 24px rgba(80, 60, 40, .06); }
  .card.bad { box-shadow: inset 0 0 0 2px rgba(246, 94, 59, .4), 0 8px 24px rgba(80, 60, 40, .06); }
  .card h2 { margin: 0; font-size: 20px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card h2 span { font-size: 12px; font-weight: 700; }
  .card.good h2 span { color: #c47d00; }
  .card.bad h2 span { color: #e85d3a; }
  .caption { min-height: 2.8em; margin: 8px 0 10px; font-size: 13px; line-height: 1.45; }
  .hud { height: 28px; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; font-weight: 800; }
  .score {
    background: #bbada0;
    color: white;
    border-radius: 4px;
    padding: 3px 8px;
    min-width: 88px;
  }
  .score b { font-size: 16px; }
  .tag {
    opacity: 0;
    padding: 2px 8px;
    border-radius: 999px;
    background: #f65e3b;
    color: white;
  }
  .card.good .tag { background: #e39b12; }
  .board {
    width: min(100%, 280px);
    aspect-ratio: 1;
    margin: 0 auto;
    position: relative;
    background: var(--board);
    border-radius: 8px;
    overflow: hidden;
  }
  .cells, .layer, .fx { position: absolute; inset: var(--pad); }
  .cells { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
  .cell { background: #cdc1b4; border-radius: 4px; }
  .layer { z-index: 2; pointer-events: none; }
  .fx { z-index: 3; pointer-events: none; }
  .tile {
    position: absolute;
    border-radius: 4px;
    display: grid;
    place-items: center;
    font-weight: 800;
    z-index: 2;
  }
  .tile.ghost { opacity: .45; filter: blur(.2px); z-index: 1; }
  .stripe {
    position: absolute;
    left: 0;
    width: 100%;
    border: 3px solid rgba(255, 70, 20, .95);
    box-shadow: inset 0 0 0 2px rgba(255, 214, 90, .95);
    border-radius: 6px;
  }
  .beam {
    position: absolute;
    height: 4px;
    border-radius: 99px;
    background: linear-gradient(90deg, transparent, #ffe08a, #fff);
    transform-origin: left center;
    box-shadow: 0 0 12px #ffe08a;
  }
  .spark {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin: -3px 0 0 -3px;
  }
  .float {
    position: absolute;
    font-weight: 900;
    font-size: 22px;
    color: #fffaf3;
    -webkit-text-stroke: 5px #c47d00;
    paint-order: stroke fill;
    z-index: 4;
    white-space: nowrap;
  }
  .card.bad .float { -webkit-text-stroke-color: #c2412d; }
  .flash {
    position: absolute;
    inset: 0;
    z-index: 1;
  }
  button.replay {
    margin-top: 10px;
    border: 0;
    background: #8f7a66;
    color: #fffaf3;
    font: inherit;
    font-weight: 800;
    border-radius: 4px;
    padding: 6px 10px;
    cursor: pointer;
  }
  @media (max-width: 900px) {
    .gallery { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile { transition: none !important; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>特效预览 <em>还没进游戏</em></h1>
  <p>六种随机事件各播一段。金色是正面，红色是负面。看哪几个过火、哪几个不够，我再接到正式对局里。</p>
</header>
<main class="gallery" id="gallery"></main>
<script>
const COLORS = {
  2: ["#eee4da", "#776e65"],
  4: ["#ede0c8", "#776e65"],
  8: ["#f2b179", "#f9f6f2"],
  16: ["#f59563", "#f9f6f2"],
  32: ["#f67c5f", "#f9f6f2"],
  64: ["#f65e3b", "#f9f6f2"],
  128: ["#edcf72", "#f9f6f2"],
  256: ["#edcc61", "#f9f6f2"],
};

const DEMOS = [
  { id: "boost", name: "升阶", tone: "good", meta: "正面 · 4 滑", caption: "16 撞上 16，不停留在 32，直接炸成 64。" },
  { id: "blank", name: "留白", tone: "good", meta: "正面 · 3 滑", caption: "合完之后新的 2 闪一下就散掉，空位留下来。" },
  { id: "diagonal", name: "斜合", tone: "good", meta: "正面 · 4 滑", caption: "斜角贴住的两个 8，被一条光吸到一起。" },
  { id: "double", name: "加倍", tone: "good", meta: "正面 · 4 滑", caption: "合出来的分数再跳一次，当场 ×2。" },
  { id: "echo", name: "回声", tone: "bad", meta: "负面 · 3 滑", caption: "棋子滑到位之后，残影按同一方向再走一截。" },
  { id: "antigrav", name: "反重力", tone: "bad", meta: "负面 · 3 滑", caption: "你在往左滑，高亮那一行却往右冲。" },
];

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

function cellSize(board) {
  return (board.clientWidth - 16 - 24) / 4;
}
function origin(board, r, c) {
  const size = cellSize(board);
  return { x: c * (size + 8), y: r * (size + 8), size };
}
function place(el, board, r, c) {
  const { x, y, size } = origin(board, r, c);
  el.style.width = `${size}px`;
  el.style.height = `${size}px`;
  el.style.left = `${x}px`;
  el.style.top = `${y}px`;
  el.dataset.r = r;
  el.dataset.c = c;
}
function paint(el, value) {
  const [bg, fg] = COLORS[value] || ["#3c3a32", "#f9f6f2"];
  el.textContent = value;
  el.style.background = bg;
  el.style.color = fg;
  el.style.fontSize = String(value).length >= 3 ? "22px" : "28px";
}
function tile(board, value, r, c, className = "tile") {
  const el = document.createElement("div");
  el.className = className;
  paint(el, value);
  place(el, board, r, c);
  return el;
}
function clear(node) {
  node.replaceChildren();
}
async function glide(el, board, r, c, ms = 420) {
  const from = el.getBoundingClientRect();
  const parent = board.getBoundingClientRect();
  const startX = from.left - parent.left - 8;
  const startY = from.top - parent.top - 8;
  const { x, y } = origin(board, r, c);
  el.style.left = `${startX}px`;
  el.style.top = `${startY}px`;
  el.style.transition = "none";
  await el.offsetWidth;
  el.style.transition = `left ${ms}ms cubic-bezier(.2,.8,.2,1), top ${ms}ms cubic-bezier(.2,.8,.2,1)`;
  el.style.left = `${x}px`;
  el.style.top = `${y}px`;
  await sleep(ms);
  el.style.transition = "none";
  place(el, board, r, c);
}
function pop(el) {
  el.animate(
    [{ transform: "scale(1)" }, { transform: "scale(1.28)" }, { transform: "scale(1)" }],
    { duration: 460, easing: "ease-out" }
  );
}
function burst(fx, board, r, c, color) {
  const { x, y, size } = origin(board, r, c);
  const cx = x + size / 2;
  const cy = y + size / 2;
  for (let i = 0; i < 14; i++) {
    const spark = document.createElement("i");
    spark.className = "spark";
    spark.style.left = `${cx}px`;
    spark.style.top = `${cy}px`;
    spark.style.background = color;
    fx.appendChild(spark);
    const angle = (Math.PI * 2 * i) / 14;
    const dist = 28 + (i % 3) * 12;
    spark.animate(
      [
        { transform: "translate(0,0) scale(1)", opacity: 1 },
        { transform: `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px) scale(.3)`, opacity: 0 },
      ],
      { duration: 560, easing: "ease-out", fill: "forwards" }
    ).finished.then(() => spark.remove());
  }
}
function floatText(fx, board, r, c, text) {
  const el = document.createElement("div");
  el.className = "float";
  el.textContent = text;
  const { x, y, size } = origin(board, r, c);
  el.style.left = `${x + size * 0.15}px`;
  el.style.top = `${y + 8}px`;
  fx.appendChild(el);
  el.animate(
    [{ opacity: 1, transform: "translateY(8px) scale(.8)" }, { opacity: 1, transform: "translateY(-6px) scale(1)" }, { opacity: 0, transform: "translateY(-28px) scale(1.05)" }],
    { duration: 900, easing: "ease-out", fill: "forwards" }
  ).finished.then(() => el.remove());
}
function flash(fx, color) {
  const el = document.createElement("div");
  el.className = "flash";
  el.style.background = color;
  fx.appendChild(el);
  el.animate([{ opacity: .0 }, { opacity: .55 }, { opacity: 0 }], { duration: 420, easing: "ease-out" })
    .finished.then(() => el.remove());
}
function showTag(tag, text) {
  tag.textContent = text;
  tag.animate([{ opacity: 0, transform: "translateY(4px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 180, fill: "forwards" });
}
function hideTag(tag) {
  tag.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 220, fill: "forwards" });
}

function mount(card) {
  const board = card.querySelector(".board");
  const layer = card.querySelector(".layer");
  const fx = card.querySelector(".fx");
  clear(layer);
  clear(fx);
  return { board, layer, fx, score: card.querySelector(".score b"), tag: card.querySelector(".tag") };
}

const plays = {
  async boost(view) {
    const a = tile(view.board, 16, 0, 0);
    const b = tile(view.board, 16, 0, 3);
    view.layer.append(a, b);
    showTag(view.tag, "16 + 16");
    await sleep(280);
    await glide(b, view.board, 0, 0, 460);
    b.remove();
    paint(a, 64);
    pop(a);
    burst(view.fx, view.board, 0, 0, "#ffe08a");
    flash(view.fx, "rgba(255, 196, 60, .45)");
    floatText(view.fx, view.board, 0, 0, "64");
    showTag(view.tag, "跳过 32");
    await sleep(1100);
  },
  async blank(view) {
    const a = tile(view.board, 8, 1, 0);
    const b = tile(view.board, 8, 1, 1);
    view.layer.append(a, b);
    showTag(view.tag, "合成");
    await sleep(220);
    await glide(b, view.board, 1, 0);
    b.remove();
    paint(a, 16);
    pop(a);
    await sleep(180);
    const ghost = tile(view.board, 2, 3, 3, "tile ghost");
    view.layer.append(ghost);
    showTag(view.tag, "新块取消");
    ghost.animate([{ opacity: .7, transform: "scale(.4)" }, { opacity: .35, transform: "scale(1)" }, { opacity: 0, transform: "scale(1.3)" }], { duration: 700, easing: "ease-out", fill: "forwards" });
    floatText(view.fx, view.board, 3, 2, "留白");
    flash(view.fx, "rgba(255, 224, 160, .35)");
    await sleep(900);
    ghost.remove();
  },
  async diagonal(view) {
    const a = tile(view.board, 8, 0, 1);
    const b = tile(view.board, 8, 1, 2);
    view.layer.append(a, b);
    showTag(view.tag, "斜着吸住");
    await sleep(220);
    const from = origin(view.board, 1, 2);
    const to = origin(view.board, 0, 1);
    const beam = document.createElement("div");
    beam.className = "beam";
    const dx = to.x - from.x;
    const dy = to.y - from.y;
    const length = Math.hypot(dx, dy);
    beam.style.width = `${length}px`;
    beam.style.left = `${from.x + from.size / 2}px`;
    beam.style.top = `${from.y + from.size / 2}px`;
    beam.style.transform = `rotate(${Math.atan2(dy, dx)}rad)`;
    view.fx.appendChild(beam);
    beam.animate([{ opacity: 0, transform: `rotate(${Math.atan2(dy, dx)}rad) scaleX(.2)` }, { opacity: 1, transform: `rotate(${Math.atan2(dy, dx)}rad) scaleX(1)` }], { duration: 280, fill: "forwards" });
    await sleep(280);
    await glide(b, view.board, 0, 1, 360);
    beam.remove();
    b.remove();
    paint(a, 16);
    pop(a);
    burst(view.fx, view.board, 0, 1, "#fff4c2");
    floatText(view.fx, view.board, 0, 1, "斜合");
    await sleep(1000);
  },
  async double(view) {
    view.score.textContent = "120";
    const a = tile(view.board, 32, 2, 0);
    const b = tile(view.board, 32, 2, 3);
    view.layer.append(a, b);
    showTag(view.tag, "+32");
    await sleep(240);
    await glide(b, view.board, 2, 0, 380);
    b.remove();
    paint(a, 64);
    pop(a);
    view.score.textContent = "152";
    await sleep(280);
    showTag(view.tag, "×2");
    view.score.textContent = "184";
    view.score.parentElement.animate(
      [{ transform: "scale(1)" }, { transform: "scale(1.18)" }, { transform: "scale(1)" }],
      { duration: 420, easing: "ease-out" }
    );
    burst(view.fx, view.board, 2, 0, "#ffe08a");
    floatText(view.fx, view.board, 1, 0, "×2");
    flash(view.fx, "rgba(255, 210, 80, .4)");
    await sleep(1000);
  },
  async echo(view) {
    const a = tile(view.board, 4, 0, 0);
    const c = tile(view.board, 2, 2, 0);
    view.layer.append(a, c);
    showTag(view.tag, "向右");
    await sleep(200);
    await Promise.all([glide(a, view.board, 0, 1, 320), glide(c, view.board, 2, 1, 320)]);
    await sleep(160);
    const ghostA = tile(view.board, 4, 0, 1, "tile ghost");
    const ghostC = tile(view.board, 2, 2, 1, "tile ghost");
    view.layer.append(ghostA, ghostC);
    showTag(view.tag, "回声再走");
    flash(view.fx, "rgba(246, 94, 59, .28)");
    await Promise.all([
      glide(a, view.board, 0, 2, 340),
      glide(c, view.board, 2, 2, 340),
      glide(ghostA, view.board, 0, 2, 340),
      glide(ghostC, view.board, 2, 2, 340),
    ]);
    ghostA.remove();
    ghostC.remove();
    floatText(view.fx, view.board, 0, 2, "回声");
    await sleep(900);
  },
  async antigrav(view) {
    const stripe = document.createElement("div");
    stripe.className = "stripe";
    const row = origin(view.board, 1, 0);
    stripe.style.top = `${row.y}px`;
    stripe.style.height = `${row.size}px`;
    view.fx.appendChild(stripe);
    const normal = [
      tile(view.board, 2, 0, 3),
      tile(view.board, 4, 2, 2),
      tile(view.board, 8, 3, 3),
    ];
    const rebel = tile(view.board, 16, 1, 0);
    view.layer.append(...normal, rebel);
    showTag(view.tag, "向左滑");
    await sleep(280);
    flash(view.fx, "rgba(255, 80, 40, .3)");
    await Promise.all([
      glide(normal[0], view.board, 0, 0, 460),
      glide(normal[1], view.board, 2, 0, 460),
      glide(normal[2], view.board, 3, 0, 460),
      glide(rebel, view.board, 1, 3, 460),
    ]);
    floatText(view.fx, view.board, 1, 2, "反向");
    showTag(view.tag, "这一行往右");
    await sleep(1000);
  },
};

function buildCard(demo) {
  const card = document.createElement("article");
  card.className = `card ${demo.tone}`;
  card.innerHTML = `
    <h2>${demo.name}<span>${demo.meta}</span></h2>
    <p class="caption">${demo.caption}</p>
    <div class="hud"><div class="score">得分 <b>${demo.id === "double" ? "120" : "—"}</b></div><div class="tag"></div></div>
    <div class="board"><div class="cells"></div><div class="layer"></div><div class="fx"></div></div>
    <button class="replay" type="button">再看一次</button>
  `;
  const cells = card.querySelector(".cells");
  for (let i = 0; i < 16; i++) cells.appendChild(document.createElement("div")).className = "cell";
  return card;
}

function startLoop(card, demo) {
  let token = 0;
  async function run(my) {
    while (token === my) {
      const view = mount(card);
      if (demo.id !== "double") view.score.textContent = "—";
      try {
        await plays[demo.id](view);
      } catch (error) {
        console.error(error);
      }
      if (token !== my) return;
      hideTag(view.tag);
      await sleep(420);
    }
  }
  card.querySelector(".replay").addEventListener("click", () => {
    token += 1;
    run(token);
  });
  run(token);
}

const gallery = document.getElementById("gallery");
DEMOS.forEach((demo, index) => {
  const card = buildCard(demo);
  gallery.appendChild(card);
  setTimeout(() => startLoop(card, demo), 180 * index);
});
</script>
</body>
</html>
